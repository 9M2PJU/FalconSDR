name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # sounddevice needs PortAudio on Linux; Qt needs EGL even offscreen.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py nr_preview.py smartscan tests
      - run: python -m unittest tests/test_remote_and_config.py -v

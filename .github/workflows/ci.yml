name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py nr_preview.py falconsdr tests
      - run: python -m unittest tests/test_core.py -v
      - if: runner.os == 'Linux'
        run: for f in falconsdr/web/static/js/*.js falconsdr/web/static/js/views/*.js; do node --check "$f"; done

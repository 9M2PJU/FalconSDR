# The kernel's own DVB-T TV-tuner driver claims RTL2832U-based dongles by
# default (they were originally sold as cheap USB TV tuners - "RTL-SDR" is
# a repurposing of the same chip), which stops any SDR software including
# this app from ever opening the device: whichever driver grabs it first at
# plug-in time keeps exclusive access. Standard, expected fix for any
# RTL-SDR-focused package (every SDR project's own setup instructions tell
# users to do exactly this) - if you actually want to use this specific
# dongle as a broadcast TV tuner too, remove this file and reboot (or
# `sudo rmmod dvb_usb_rtl28xxu`).
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
